<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sattva — Sarvam Voice Agent (web)</title>
<style>
:root{--g900:#123524;--g700:#1f5f40;--g600:#2e8b57;--accent:#c8871a;--line:#2a5440;--ink:#eaf6ee;--muted:#9fc0ac}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,"Noto Sans Telugu",Arial,sans-serif;background:radial-gradient(900px 500px at 20% -10%,#1f5f40,#0f2d1f 60%);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px}
.app{width:100%;max-width:520px;background:#0c2118;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column;height:min(90vh,780px)}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#173a2a,#122c21)}
.dot{width:10px;height:10px;border-radius:50%;background:#3fa66b}
.top b{display:block}.top .sub{font-size:.75rem;color:var(--muted)}
.langbtn{margin-left:auto;background:#1c4634;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;font-size:.8rem;cursor:pointer}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:84%;padding:11px 14px;border-radius:16px;font-size:.94rem;line-height:1.55;white-space:pre-wrap}
.bubble.agent{background:#1c4634;border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.bubble.user{background:#2e8b57;color:#04140c;border-bottom-right-radius:4px;align-self:flex-end;font-weight:600}
.bubble.sys{align-self:center;color:var(--muted);font-size:.78rem;text-align:center}
.bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:#122c21}
.bar input{flex:1;background:#0c2118;border:1px solid var(--line);border-radius:999px;padding:11px 16px;color:var(--ink);font:inherit}
button{border:0;border-radius:999px;cursor:pointer;font-weight:700;font:inherit}
.mic{background:var(--g600);color:#fff;padding:11px 16px;font-size:1.1rem}
.mic.rec{background:#b91c1c;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.send{background:var(--accent);color:#241a02;padding:0 16px}
.status{padding:8px 16px;font-size:.76rem;color:var(--muted);border-top:1px solid var(--line)}
.hint{padding:10px 16px;font-size:.74rem;color:var(--muted);background:#0e2519}
.keywarn{background:#5a2a00;color:#ffd9a8;padding:9px 16px;font-size:.78rem;border-bottom:1px solid #7a3c00}
.hidden{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="dot"></span>
    <div><b>Sattva Wellness Centre</b><div class="sub" id="sub">Voice agent · powered by Sarvam</div></div>
    <button class="langbtn" id="langbtn" onclick="toggleLang()">తెలుగు</button>
  </div>
  <div class="keywarn hidden" id="keywarn">Server has no SARVAM_API_KEY set — add it and restart. The agent cannot reply until then.</div>
  <div class="log" id="log"></div>
  <div class="bar">
    <input id="txt" placeholder="Type a message…" onkeydown="if(event.key==='Enter')sendText()">
    <button class="mic" id="mic" onclick="toggleRec()">🎙</button>
    <button class="send" onclick="sendText()">Send</button>
  </div>
  <div class="status" id="status">Ready.</div>
  <div class="hint">Speak after pressing the mic. Everything runs on Sarvam: Saaras for speech-to-text, sarvam-105b for the reply, Bulbul for the voice.</div>
</div>

<script>
let LANG = 'en-IN';
let messages = [];
let mediaRecorder = null, chunks = [], recording = false;
let currentAudio = null;

const el = id => document.getElementById(id);
const TXT = {
  en:{ sub:'Voice agent · powered by Sarvam', ph:'Type a message…', ready:'Ready.', listening:'Listening… tap the mic again to stop.',
       thinking:'Thinking…', speaking:'Speaking…', sending:'Sending…', greet:"Namaste! Thank you for calling Sattva Wellness Centre. How may I help you today?" },
  te:{ sub:'వాయిస్ ఏజెంట్ · సర్వం ఆధారితం', ph:'సందేశం టైప్ చేయండి…', ready:'సిద్ధం.', listening:'వింటున్నాము… ఆపడానికి మళ్లీ మైక్ నొక్కండి.',
       thinking:'ఆలోచిస్తున్నాము…', speaking:'మాట్లాడుతున్నాము…', sending:'పంపుతున్నాము…', greet:"నమస్తే! సత్వ వెల్నెస్ సెంటర్‌కు కాల్ చేసినందుకు ధన్యవాదాలు. మీకు ఎలా సహాయం చేయగలను?" }
};
const t = k => TXT[LANG.startsWith('te') ? 'te' : 'en'][k];

function bubble(who, text){
  const d = document.createElement('div');
  d.className = 'bubble ' + who; d.textContent = text;
  el('log').appendChild(d); el('log').scrollTop = el('log').scrollHeight;
}
function setStatus(s){ el('status').textContent = s; }

function toggleLang(){
  LANG = LANG.startsWith('te') ? 'en-IN' : 'te-IN';
  el('langbtn').textContent = LANG.startsWith('te') ? 'English' : 'తెలుగు';
  el('sub').textContent = t('sub'); el('txt').placeholder = t('ph');
  if (el('status').textContent === 'Ready.' || el('status').textContent === 'సిద్ధం.') setStatus(t('ready'));
}

async function sendText(){
  const v = el('txt').value.trim(); if(!v) return; el('txt').value='';
  await turn(v);
}

async function toggleRec(){
  if (recording){ mediaRecorder.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder){ setStatus('Recording not supported in this browser — please type.'); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = async () => {
      recording = false; el('mic').classList.remove('rec');
      stream.getTracks().forEach(tr => tr.stop());
      const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      setStatus(t('thinking'));
      try{
        const fd = new FormData();
        fd.append('file', blob, 'audio.webm');
        fd.append('lang', LANG);
        const r = await fetch('/api/stt', { method:'POST', body: fd });
        const j = await r.json();
        if (j.error){ setStatus('Speech-to-text error: ' + j.error.slice(0,120)); return; }
        const said = (j.transcript || '').trim();
        if (!said){ setStatus('Did not catch that — try again.'); return; }
        await turn(said);
      }catch(e){ setStatus('Error: ' + e.message); }
    };
    mediaRecorder.start(); recording = true; el('mic').classList.add('rec'); setStatus(t('listening'));
  }catch(e){ setStatus('Microphone blocked: ' + e.message); }
}

async function turn(userText){
  bubble('user', userText);
  messages.push({ role:'user', content: userText });
  setStatus(t('thinking'));
  try{
    const cr = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ messages, lang: LANG }) });
    const cj = await cr.json();
    if (cj.error){ setStatus('Chat error: ' + cj.error.slice(0,120)); return; }
    let reply = cj.reply;

    if (reply.includes('[EMERGENCY]')){
      reply = LANG.startsWith('te')
        ? 'ఇది అత్యవసర పరిస్థితిలా ఉంది. దయచేసి వెంటనే 108కు కాల్ చేయండి లేదా దగ్గరి ఆసుపత్రికి వెళ్లండి.'
        : 'This sounds like a medical emergency. Please call 108 or go to the nearest hospital immediately.';
    } else if (reply.includes('[CALLBACK]')){
      reply = LANG.startsWith('te')
        ? 'మా టీమ్ నుండి ఎవరైనా మీకు త్వరలో కాల్ చేస్తారు. ధన్యవసరాలు.'
        : 'I will have someone from our team call you back. Thank you for calling Sattva.';
    }

    messages.push({ role:'assistant', content: reply });
    bubble('agent', reply);
    setStatus(t('speaking'));
    await speak(reply);
    setStatus(t('ready'));
  }catch(e){ setStatus('Error: ' + e.message); }
}

async function speak(text){
  try{
    const r = await fetch('/api/tts', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text, lang: LANG }) });
    const j = await r.json();
    if (j.error || !j.audio_base64){ setStatus('TTS error: ' + (j.error||'no audio').slice(0,120)); return; }
    if (currentAudio) currentAudio.pause();
    currentAudio = new Audio('data:audio/wav;base64,' + j.audio_base64);
    await currentAudio.play().catch(()=>{});
  }catch(e){ setStatus('TTS error: ' + e.message); }
}

// opening greeting
bubble('agent', TXT.en.greet);

// warn if the server has no API key configured
fetch('/api/health').then(r=>r.json()).then(j=>{ if(!j.key_configured) el('keywarn').classList.remove('hidden'); }).catch(()=>el('keywarn').classList.remove('hidden'));
</script>
</body>
</html>
